[package]
name = "metaweave"
version = "0.2.0"
edition = "2024"
description = "Pre-production website checker: SEO, social cards, accessibility, performance, security and more — in a single CLI."
readme = "README.md"
keywords = ["seo", "lighthouse", "website", "linter", "cli"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
colored = "3.1.1"
comfy-table = "7.2.2"
futures = "0.3"
reqwest = { version = "0.13.3", features = ["gzip", "brotli"] }
scraper = "0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
